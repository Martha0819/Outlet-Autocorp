<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#251f1d">
  <title>Outlet Autocorp — Mini CRM (Diseño 3: Titanium Glass Studio)</title>

  <!-- Google Fonts: Montserrat (Alternativa autorizada a Gotham) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- SELECTOR GLOBAL DE DISEÑOS -->
  <div class="glass-design-selector">
    <span>CONMUTADOR DE DISEÑOS OUTLET AUTOCORP</span>
    <div class="glass-selector-chips">
      <a href="../index.html">Diseño 1: Clásico</a>
      <a href="../diseno2/index.html">Diseño 2: Executive</a>
      <a href="index.html" class="active">Diseño 3: Titanium Glass</a>
      <a href="../diseno4/index.html">Diseño 4: Carbon VIP</a>
    </div>
  </div>

  <!-- ENCABEZADO TITANIUM GLASS -->
  <header class="glass-header">
    <div class="glass-header-inner">
      <div class="glass-brand">
        <div class="glass-brand-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><circle cx="12" cy="11" r="3"/></svg>
        </div>
        <div>
          <span class="glass-brand-title">OUTLET AUTOCORP</span>
          <div class="glass-brand-sub">TITANIUM GLASS STUDIO</div>
        </div>
      </div>

      <nav class="glass-nav-dock">
        <button class="glass-nav-btn active" data-view="general">
          <span>General</span>
        </button>
        <button class="glass-nav-btn" data-view="guardias">
          <span>Guardias & Actividades</span>
        </button>
        <button class="glass-nav-btn" data-view="clientes">
          <span>Clientes</span>
        </button>
        <button class="glass-nav-btn" data-view="inventario">
          <span>Inventario</span>
        </button>
      </nav>

      <div class="d-flex align-center gap-2">
        <button class="btn-glass btn-glass-sm" id="btn-glass-reset">↺ Reset demo</button>
      </div>
    </div>
  </header>

  <!-- BANNER TITANIUM HERO -->
  <section class="glass-hero-banner">
    <div class="glass-hero-card">
      <div>
        <span class="glass-badge-pill mb-2">⚡ Centro de Mando Titanium Glass</span>
        <h1 class="glass-title" id="glass-hero-title">Vista General — Dashboard Holográfico</h1>
        <div class="glass-meta-line mt-1">Outlet Autocorp México · Operaciones en Vivo · <span id="glass-live-date">Hoy</span></div>
      </div>
    </div>
  </section>

  <!-- CONTENEDOR PRINCIPAL -->
  <main class="glass-content" id="glass-view-container">
    <!-- Vistas inyectadas dinámicamente -->
  </main>

  <div id="toast-container" class="toast-container"></div>
  <script src="js/app.js?v=3.5"></script>
</body>
</html>
